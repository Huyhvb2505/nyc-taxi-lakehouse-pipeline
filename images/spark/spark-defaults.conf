# Both table formats enabled for every SparkSession on the cluster.
#   * Delta  -> default session catalog (spark_catalog) + path-based access.
#   * Iceberg -> a dedicated Hadoop catalog named `iceberg`
#                (tables live under file:///data/lakehouse/iceberg).
# Students may use EITHER format for their medallion tables.
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Delta (default catalog) ---
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Iceberg (named catalog: iceberg.<db>.<table>) ---
spark.sql.catalog.iceberg            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type       hadoop
spark.sql.catalog.iceberg.warehouse  file:///data/lakehouse/iceberg

spark.sql.warehouse.dir              file:///data/lakehouse
